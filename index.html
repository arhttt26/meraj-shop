<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05070c;
  --bg-soft:#0a0e18;
  --surface:#0f1522;
  --surface-2:#161d2e;
  --border:#1f2740;
  --text:#eef2f9;
  --text-dim:#7c88a3;
  --accent:#2aabee;
  --accent-deep:#1c8fd1;
  --gold:#f2b640;
  --violet:#9b7bff;
  --rose:#ff6f91;
  --teal:#33d0ac;
  --radius-lg:18px;
  --radius-md:12px;
}

html[data-theme="light"]{
  --bg:#ffffff;
  --bg-soft:#eef6fd;
  --surface:#ffffff;
  --surface-2:#eaf4fc;
  --border:#d9e8f7;
  --text:#0c1626;
  --text-dim:#5b6c85;
  --accent:#1c93d6;
  --accent-deep:#127bb8;
  --gold:#c98a12;
  --violet:#7a5ce0;
  --rose:#e0466f;
  --teal:#159b7d;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Vazirmatn',sans-serif;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(42,171,238,0.10), transparent 60%),
    radial-gradient(700px 400px at 5% 10%, rgba(155,123,255,0.06), transparent 55%),
    var(--bg);
  color:var(--text);
  line-height:1.6;
}

a{color:inherit;}

/* ---------- Ambient background ---------- */
.bg-blobs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;}
.blob-1{width:340px;height:340px;background:radial-gradient(circle, var(--accent), transparent 70%);top:-80px;right:-60px;animation:driftA 22s ease-in-out infinite;}
.blob-2{width:280px;height:280px;background:radial-gradient(circle, var(--violet), transparent 70%);bottom:8%;left:-80px;animation:driftB 26s ease-in-out infinite;}
.blob-3{width:220px;height:220px;background:radial-gradient(circle, var(--teal), transparent 70%);bottom:-60px;right:18%;animation:driftC 30s ease-in-out infinite;}
html[data-theme="light"] .blob{opacity:.16;}
@keyframes driftA{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,40px) scale(1.15);}}
@keyframes driftB{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-30px) scale(1.1);}}
@keyframes driftC{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-20px,-40px) scale(1.2);}}

/* ---------- Header corner buttons ---------- */
.corner-btn{
  position:absolute;
  top:18px;
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.corner-btn:hover{background:var(--surface-2);}
.corner-btn svg{width:19px;height:19px;display:block;}
.neon-icon{
  filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 8px currentColor);
}
.theme-toggle{left:18px;}
.cart-toggle{right:18px;color:var(--accent);}
.icon-sun{color:var(--gold);}
.icon-moon{color:var(--accent);}

/* ---------- Tab bar ---------- */
.tabs{
  display:flex;
  gap:8px;
  padding:14px 16px;
  overflow-x:auto;
  position:sticky;
  top:0;
  z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-indicator{
  position:absolute;
  top:14px;
  height:calc(100% - 28px);
  border-radius:12px;
  background:var(--accent);
  box-shadow:0 4px 14px rgba(42,171,238,.35);
  transition:left .32s cubic-bezier(.4,0,.2,1), width .32s cubic-bezier(.4,0,.2,1);
  z-index:0;
}
.tab-btn{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:9px 15px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-dim);
  font-family:inherit;
  font-weight:600;
  font-size:13.5px;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.tab-btn:hover{border-color:var(--accent);color:var(--text);}
.tab-btn.active{
  background:transparent;
  border-color:transparent;
  color:#04101c;
}
.tab-icon{display:flex;align-items:center;}
.tab-icon svg{width:16px;height:16px;display:block;}

/* ---------- Tab panels ---------- */
.cat-panel{display:none;}
.cat-panel.active{display:block;animation:panel-in .18s ease;}
@keyframes panel-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Header ---------- */
header{
  position:relative;
  padding:34px 20px 28px;
  text-align:center;
  background:linear-gradient(180deg,var(--bg-soft),var(--bg) 90%);
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
header::before{
  content:"";
  position:absolute;
  inset:-40% -10% auto -10%;
  height:220px;
  background:radial-gradient(closest-side, rgba(42,171,238,0.18), transparent 70%);
  pointer-events:none;
}
.brand-mark{
  position:relative;
  width:56px;
  height:56px;
  margin:0 auto 14px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 24px rgba(42,171,238,0.35);
}
.brand-mark svg{width:28px;height:28px;}
header h1{
  margin:0;
  font-size:26px;
  font-weight:800;
  letter-spacing:.2px;
}
header p{
  margin:8px 0 0;
  font-size:14px;
  color:var(--text-dim);
  font-weight:500;
}
.lang-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  margin:16px auto 0;
  padding:7px 15px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-dim);
  font-family:inherit;
  font-size:12.5px;
  font-weight:700;
}
.lang-toggle:hover{border-color:var(--accent);color:var(--text);}
.lang-icon{width:15px;height:15px;color:var(--accent);}

/* ---------- Buttons & inputs ---------- */
button{
  position:relative;
  overflow:hidden;
  font-family:inherit;
  padding:9px 18px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#06121c;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
button:hover{background:var(--accent-deep);}
button:active{transform:scale(0.97);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  transform:scale(0);
  animation:rippleAnim .5s ease-out;
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(2.4);opacity:0;}}

input{
  font-family:inherit;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
input::placeholder{color:var(--text-dim);}

/* ---------- Category sections ---------- */
.category{
  padding:28px 20px 4px;
  max-width:960px;
  margin:0 auto;
}

/* ---------- Product grid ---------- */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}
.card{
  position:relative;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  padding:22px 16px 18px;
  border-radius:var(--radius-lg);
  text-align:center;
  transition:border-color .15s ease, transform .15s ease;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px);}
.card::before{
  content:"";
  position:absolute;
  top:0;left:-60%;
  width:40%;height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.12), transparent);
  transform:skewX(-20deg);
  transition:left .55s ease;
  pointer-events:none;
}
.card:hover::before{left:130%;}
html[data-theme="light"] .card::before{background:linear-gradient(120deg, transparent, rgba(20,45,80,.06), transparent);}
.icon{
  width:58px;
  height:58px;
  margin:0 auto 14px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--surface-2);
  border:1px solid var(--border);
  box-shadow:0 6px 16px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
}
.icon svg{width:26px;height:26px;}
html[data-theme="light"] .icon{box-shadow:0 6px 16px rgba(20,45,80,.10), inset 0 1px 0 rgba(255,255,255,.6);}
.cat-stars .icon{color:var(--gold);background:linear-gradient(160deg, rgba(242,182,64,.22), rgba(242,182,64,.04));border-color:rgba(242,182,64,.4);}
.cat-premium .icon{color:var(--accent);background:linear-gradient(160deg, rgba(42,171,238,.22), rgba(42,171,238,.04));border-color:rgba(42,171,238,.4);}
.cat-nft .icon{color:var(--violet);background:linear-gradient(160deg, rgba(155,123,255,.22), rgba(155,123,255,.04));border-color:rgba(155,123,255,.4);}
.cat-gift .icon{color:var(--rose);background:linear-gradient(160deg, rgba(255,111,145,.22), rgba(255,111,145,.04));border-color:rgba(255,111,145,.4);}
.cat-meow .icon{color:var(--teal);background:linear-gradient(160deg, rgba(51,208,172,.22), rgba(51,208,172,.04));border-color:rgba(51,208,172,.4);}
.card h4{
  margin:0 0 8px;
  font-size:15px;
  font-weight:600;
}
.card p{
  margin:0 0 14px;
  font-size:14px;
  color:var(--text-dim);
}
.card p b{color:var(--text);font-weight:700;}
.card button{width:100%;}

.empty-msg{
  grid-column:1/-1;
  color:var(--text-dim);
  padding:22px;
  text-align:center;
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:var(--radius-md);
  font-size:14px;
}

/* ---------- Note & calculator boxes ---------- */
.note-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-right:3px solid var(--accent);
  border-radius:var(--radius-md);
  padding:16px 18px;
  margin-bottom:16px;
  line-height:2;
  font-size:14px;
  color:var(--text-dim);
}
.note-box b{color:var(--text);font-weight:700;}

.calc-box{
  position:relative;
  overflow:hidden;
  background:linear-gradient(165deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:22px 20px;
  margin-bottom:8px;
}
.calc-box::before{
  content:"";
  position:absolute;
  top:-60px;
  left:-40px;
  width:160px;
  height:160px;
  border-radius:50%;
  filter:blur(50px);
  opacity:.5;
  pointer-events:none;
}
.cat-stars .calc-box::before{background:var(--gold);}
.cat-meow .calc-box::before{background:var(--teal);}

.calc-header{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}
.calc-header .icon{width:46px;height:46px;margin:0;}
.calc-header .icon svg{width:22px;height:22px;}
.calc-header-text h4{margin:0;font-size:15.5px;font-weight:700;}
.calc-header-text p{margin:2px 0 0;font-size:12px;color:var(--text-dim);}

.calc-box label{
  position:relative;
  display:block;
  margin-bottom:10px;
  font-size:13.5px;
  color:var(--text-dim);
}
.calc-input-wrap{
  display:flex;
  align-items:stretch;
  gap:10px;
  margin-bottom:14px;
}
.calc-input-wrap input{
  flex:1;
  min-width:0;
  width:auto;
  max-width:none;
  padding:14px 12px;
  font-size:16px;
  font-weight:700;
  text-align:center;
}
.calc-input-suffix{
  flex:none;
  display:flex;
  align-items:center;
  font-size:12.5px;
  font-weight:700;
  color:var(--text-dim);
  pointer-events:none;
}
.cat-stars .calc-input-suffix{color:var(--gold);}
.cat-meow .calc-input-suffix{color:var(--teal);}
.cat-stars .calc-input-wrap input:focus-visible{outline-color:var(--gold);}
.cat-meow .calc-input-wrap input:focus-visible{outline-color:var(--teal);}

.stepper-group{
  flex:none;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.stepper-btn{
  width:32px;
  height:100%;
  min-height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text-dim);
  font-family:inherit;
  font-size:15px;
  font-weight:800;
  line-height:1;
}
.cat-stars .stepper-btn:hover{border-color:var(--gold);color:var(--text);background:rgba(242,182,64,.12);}
.cat-meow .stepper-btn:hover{border-color:var(--teal);color:var(--text);background:rgba(51,208,172,.12);}
.stepper-btn:active{transform:scale(.92);}

.calc-presets{
  position:relative;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}
.calc-chip{
  padding:7px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text-dim);
  font-family:inherit;
  font-size:12.5px;
  font-weight:600;
}
.cat-stars .calc-chip:hover{border-color:var(--gold);color:var(--text);background:rgba(242,182,64,.12);}
.cat-meow .calc-chip:hover{border-color:var(--teal);color:var(--text);background:rgba(51,208,172,.12);}

.calc-preview{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:20px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 16px;
  margin-bottom:14px;
  transition:min-height .15s ease, padding .15s ease;
}
.calc-preview:empty{padding:0;border-color:transparent;background:transparent;}
.calc-preview:not(:empty){min-height:48px;}
.calc-preview-label{font-size:12.5px;color:var(--text-dim);}
.calc-preview-value{font-size:17px;font-weight:800;}
.cat-stars .calc-preview-value{color:var(--gold);}
.cat-meow .calc-preview-value{color:var(--teal);}

.calc-box > button{
  position:relative;
  width:100%;
}

/* ---------- Footer ---------- */
.site-footer{
  max-width:960px;
  margin:12px auto 0;
  padding:26px 20px 40px;
  text-align:center;
}
.site-footer p{
  margin:0 0 14px;
  font-size:13.5px;
  color:var(--text-dim);
}
.footer-cart-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--surface);
  color:var(--accent);
  border:1px solid var(--border);
  font-size:13.5px;
  padding:10px 20px;
}
.footer-cart-btn:hover{background:var(--surface-2);border-color:var(--accent);}
.footer-cart-btn svg{width:17px;height:17px;}

/* ---------- Cart modal ---------- */
.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(2,4,8,.6);
  backdrop-filter:blur(3px);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.cart-overlay.open{
  opacity:1;
  pointer-events:auto;
}
.cart-panel{
  position:relative;
  width:100%;
  max-width:600px;
  max-height:85vh;
  overflow-y:auto;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:24px 24px 0 0;
  padding:14px 20px 32px;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.35);
}
.cart-overlay.open .cart-panel{transform:translateY(0);}
.cart-panel-handle{
  width:38px;
  height:4px;
  border-radius:3px;
  background:var(--border);
  margin:0 auto 14px;
}
.cart-close-btn{
  position:absolute;
  top:14px;
  left:16px;
  width:32px;
  height:32px;
  border-radius:10px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-dim);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.cart-close-btn svg{width:15px;height:15px;}
.cart-close-btn:hover{color:var(--text);background:var(--surface-2);}
.cart-panel h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:18px;
  margin:6px 0 14px;
}
.cart-icon{position:relative;display:flex;align-items:center;color:var(--accent);}
.cart-icon svg{width:20px;height:20px;display:block;}
#cart{margin-bottom:14px;}
.cart-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--surface);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:var(--radius-md);
  margin-bottom:8px;
  max-width:460px;
  font-size:14px;
}
.remove-btn{
  background:transparent;
  color:#ff7676;
  border:1px solid rgba(255,118,118,0.4);
  padding:5px 12px;
  font-size:12px;
  font-weight:600;
}
.remove-btn:hover{background:rgba(255,118,118,0.12);}

#total{
  font-size:16px;
  font-weight:700;
  margin-bottom:14px;
}
#total::before{content:"";}

#orderResult .note-box{border-right-color:var(--gold);}

.rules-box{
  position:relative;
  overflow:hidden;
  background:linear-gradient(160deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);
  border-right:3px solid var(--gold);
  border-radius:var(--radius-md);
  margin-bottom:16px;
}
.rules-summary{
  width:100%;
  padding:13px 16px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-weight:700;
  font-size:13.5px;
  font-family:inherit;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--text);
}
.rules-summary:hover{background:rgba(242,182,64,.08);}
.rules-chevron{
  width:16px;
  height:16px;
  flex:none;
  color:var(--gold);
  transform:rotate(90deg);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.rules-box.open .rules-chevron{transform:rotate(-90deg);}
.rules-box:not(.open) .rules-summary{animation:rulesPulse 2.6s ease-in-out infinite;}
@keyframes rulesPulse{
  0%,100%{box-shadow:inset 0 0 0 rgba(242,182,64,0);}
  50%{box-shadow:inset 0 0 24px rgba(242,182,64,.12);}
}
.rules-panel{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1);
}
.rules-box.open .rules-panel{grid-template-rows:1fr;}
.rules-panel-inner{overflow:hidden;min-height:0;}
.rules-content{
  padding:2px 16px 16px;
  font-size:13px;
  line-height:2.1;
  color:var(--text-dim);
}
.rules-content b{color:var(--gold);}
.rules-box.enter{animation:fadeSlideUp .45s ease .15s both;}
#orderResult input[readonly]{
  cursor:text;
  margin-bottom:8px;
}

/* ---------- Motion ---------- */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cartItemIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes softPulse{0%,100%{opacity:.55;}50%{opacity:1;}}
@keyframes pulseScale{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes checkPop{from{opacity:0;transform:scale(.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes cartItemOut{to{opacity:0;transform:scale(.9) translateY(-4px);}}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(540deg);opacity:0;}}

header .brand-mark{animation:fadeSlideUp .55s ease both, floatY 3.2s ease-in-out .6s infinite;}
header h1{animation:fadeSlideUp .55s ease .12s both;}
header p{animation:fadeSlideUp .55s ease .22s both;}
.corner-btn{animation:fadeSlideUp .5s ease .3s both;}
.corner-btn.spin{animation:spin .4s ease;}
.lang-toggle{animation:fadeSlideUp .5s ease .38s both;}

function renderProducts(){

    </button>`).join("");
  document.getElementById("tabs").innerHTML = `<div class="tab-indicator" id="tabIndicator"></div>` + tabsHtml;
  updateTabIndicator();
  requestAnimationFrame(updateTabIndicator);

  const container=document.getElementById("products");
  let html="";
  categories.forEach(cat=>{
    html+=`<div class="category cat-${cat.id} cat-panel ${cat.id===activeCat?'active':''}" id="cat-${cat.id}">`;
    if(cat.note){
      html+=`<div class="note-box">${cat.note[currentLang]}</div>`;
    }else if(!cat.calculator){
      html+=`<div class="container">`;
      if(cat.products.length===0){
        html+=`<div class="empty-msg">${t("emptyMsg")}</div>`;
      }else{
        cat.products.forEach((p,i)=>{
          html+=`
          <div class="card" style="--i:${i}">
            <div class="icon">${CATEGORY_ICONS[cat.id]}</div>
            <h4>${p[currentLang]}</h4>
            <p><b>${p.price.toLocaleString(currentLang==='fa'?'fa-IR':'en-US')}</b><br>${t("currency")}</p>
            <button onclick="add('${p.key}')">${t("buyBtn")}</button>
          </div>`;
        });
      }
      html+=`</div>`;
    }
    if(cat.calculator){
      html+=buildCalcBoxHtml(cat);
    }
    html+=`</div>`;
  });
  container.innerHTML=html;
  Object.keys(CALC_CONFIG).forEach(type=>{
    const cfg=CALC_CONFIG[type];
    const input=document.getElementById(cfg.inputId);
    if(input){
      input.addEventListener("input", ()=>updateCalcPreview(type));
    }
  });
}

function openCart(){
  const overlay=document.getElementById("cartOverlay");
  if(overlay){
    overlay.classList.add("open");
    document.body.style.overflow="hidden";
  }
  const rulesBox=document.getElementById("rulesBox");
  if(rulesBox){
    rulesBox.classList.remove("enter");
    void rulesBox.offsetWidth;
    rulesBox.classList.add("enter");
  }
}

function closeCart(){
  const overlay=document.getElementById("cartOverlay");
  if(overlay){
    overlay.classList.remove("open");
    document.body.style.overflow="";
  }
}

function toggleRules(){
  const box=document.getElementById("rulesBox");
  if(box) box.classList.toggle("open");
}

function showTab(id){
  activeCat=id;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.tab-btn.cat-${id}`).classList.add("active");
  document.querySelectorAll(".cat-panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(`cat-${id}`).classList.add("active");
  updateTabIndicator();
}

function updateTabIndicator(){
  const tabsEl=document.getElementById("tabs");
  const indicator=document.getElementById("tabIndicator");
  if(!tabsEl||!indicator) return;
  const activeBtn=tabsEl.querySelector(".tab-btn.active");
  if(!activeBtn) return;
  const firstPlacement = !indicator.dataset.placed;
  if(firstPlacement) indicator.style.transition="none";
  indicator.style.left=activeBtn.offsetLeft+"px";
  indicator.style.width=activeBtn.offsetWidth+"px";
  if(firstPlacement){
    void indicator.offsetWidth;
    indicator.style.transition="";
    indicator.dataset.placed="1";
  }
}
window.addEventListener("resize", updateTabIndicator);
window.addEventListener("load", updateTabIndicator);
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(updateTabIndicator).catch(()=>{});
}

function meowRate(qty){
  if(qty < 9000000) return null;
  if(qty < 15000000) return 9000;
  return 8000; // 15,000,000 and above (covers 15-25M and beyond, up to the 500M limit)
}

function tLang(key, lang){
  return (TRANSLATIONS[key] && TRANSLATIONS[key][lang]) || key;
}

function meowPrice(qty){
  const rate=meowRate(qty);
  if(rate===null) return null;
  return Math.round((qty/1000000)*rate);
}

const CALC_CONFIG = {
  star: {
    inputId:"starQty", previewId:"starPricePreview",
    min:STAR_MIN, max:STAR_MAX, step:1, inc:5,
    priceFn: qty=>Math.round(qty*STAR_PRICE),
    labelKey:"starLabel", placeholderKey:"starPlaceholder", unitKey:"starUnit",
    rangeErrorKey:"starRangeError", alertRangeKey:"starAlertRange",
    keyPrefix:"star-",
    presets:[50,100,500,1000,5000,15000]
  },
  meow: {
    inputId:"meowQty", previewId:"meowPricePreview",
    min:9000000, max:500000000, step:1000000, inc:1000000,
    priceFn: meowPrice,
    labelKey:"meowLabel", placeholderKey:"meowPlaceholder", unitKey:"meowUnit",
    rangeErrorKey:"meowRangeError", alertRangeKey:"meowAlertRange",
    keyPrefix:"meow-",
    presets:[9000000,15000000,25000000,50000000]
  }
};

function buildCalcBoxHtml(cat){
  const type=cat.calcType;
  const cfg=CALC_CONFIG[type];
  const locale = currentLang==='fa' ? 'fa-IR' : 'en-US';
  const presetsHtml = cfg.presets.map(v=>
    `<button type="button" class="calc-chip" onclick="setCalcValue('${type}',${v})">${v.toLocaleString(locale)}</button>`
  ).join("");
  return `
  <div class="calc-box">
    <div class="calc-header">
      <div class="icon">${CATEGORY_ICONS[cat.id]}</div>
      <div class="calc-header-text">
        <h4>${cat.title[currentLang]}</h4>
        <p>${t("calcSubtitle")}</p>
      </div>
    </div>
    <label for="${cfg.inputId}">${t(cfg.labelKey)}</label>
    <div class="calc-input-wrap">
      <div class="stepper-group">
        <button type="button" class="stepper-btn" onclick="stepCalc('${type}',1)" aria-label="+">+</button>
        <button type="button" class="stepper-btn" onclick="stepCalc('${type}',-1)" aria-label="-">−</button>
      </div>
      <input type="number" id="${cfg.inputId}" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" placeholder="${t(cfg.placeholderKey)}">
      <span class="calc-input-suffix">${t(cfg.unitKey)}</span>
    </div>
    <div class="calc-presets">${presetsHtml}</div>
    <div id="${cfg.previewId}" class="calc-preview"></div>
    <button onclick="addCalcToCart('${type}')">${t("meowAddBtn")}</button>
  </div>`;
}

function setCalcValue(type, val){
  const cfg=CALC_CONFIG[type];
  const input=document.getElementById(cfg.inputId);
  if(!input) return;
  input.value=val;
  updateCalcPreview(type);
  input.focus();
}

function stepCalc(type, dir){
  const cfg=CALC_CONFIG[type];
  const input=document.getElementById(cfg.inputId);
  if(!input) return;
  let val=parseInt(input.value);
  if(!val || isNaN(val)){
    val = cfg.min;
  }else{
    val += dir*cfg.inc;
  }
  if(val<cfg.min) val=cfg.min;
  if(val>cfg.max) val=cfg.max;
  input.value=val;
  updateCalcPreview(type);
}

function updateCalcPreview(type){
  const cfg=CALC_CONFIG[type];
  const input=document.getElementById(cfg.inputId);
  const preview=document.getElementById(cfg.previewId);
  if(!input||!preview) return;
  const qty=parseInt(input.value);
  if(!qty){ preview.innerHTML=""; return; }
  if(qty<cfg.min || qty>cfg.max){
    preview.innerHTML=`<span class="calc-preview-label">${t(cfg.rangeErrorKey)}</span>`;
    return;
  }
  const price=cfg.priceFn(qty);
  const locale = currentLang==='fa' ? 'fa-IR' : 'en-US';
  preview.innerHTML=`<span class="calc-preview-label">${t("meowPriceLabel")}</span><span class="calc-preview-value">${price.toLocaleString(locale)} ${t("currency")}</span>`;
}

function addCalcToCart(type){
  const cfg=CALC_CONFIG[type];
  const input=document.getElementById(cfg.inputId);
  const qty=parseInt(input.value);
  if(!qty || qty<cfg.min || qty>cfg.max){
    alert(t(cfg.alertRangeKey));
    return;
  }
  const price=cfg.priceFn(qty);
  const key=cfg.keyPrefix+qty;
  productMeta[key] = {
    fa: qty.toLocaleString('fa-IR')+" "+tLang(cfg.unitKey,"fa"),
    en: qty.toLocaleString('en-US')+" "+tLang(cfg.unitKey,"en"),
    price: price
  };
  add(key);
  input.value="";
  const preview=document.getElementById(cfg.previewId);
  if(preview) preview.innerHTML="";
}

function add(key){
  const meta = productMeta[key];
  if(!meta) return;
  if(!cart[key]) cart[key]=0;
  cart[key]++;
  itemPrice[key]=meta.price;
  total+=meta.price;
  updateCart();
}

function updateCart(){
  let html="";
  for(let key in cart){
    const meta = productMeta[key] || {fa:key, en:key};
    const label = meta[currentLang] || meta.fa;
    html+=`<div class="cart-item" data-name="${key}"><span>${cart[key]} × ${label}</span><button class="remove-btn" onclick="removeFromCart('${key}')">${t("removeBtn")}</button></div>`;
  }
  document.getElementById("cart").innerHTML=html;
  animateTotalTo(total);
}

function animateTotalTo(target){
  const el=document.getElementById("total");
  const locale = currentLang==='fa' ? 'fa-IR' : 'en-US';
  const start=parseInt(el.dataset.value||"0",10);
  if(start===target){
    el.textContent=t("totalLabel")+": "+target.toLocaleString(locale)+" "+t("currency");
    return;
  }
  const duration=300;
  const startTime=performance.now();
  el.classList.add("pulse");
  function step(now){
    const p=Math.min((now-startTime)/duration,1);
    const eased=1-Math.pow(1-p,3);
    const val=Math.round(start+(target-start)*eased);
    el.textContent=t("totalLabel")+": "+val.toLocaleString(locale)+" "+t("currency");
    if(p<1){
      requestAnimationFrame(step);
    }else{
      el.dataset.value=target;
      setTimeout(()=>el.classList.remove("pulse"),300);
    }
  }
  requestAnimationFrame(step);
}

function removeFromCart(name){
  if(!cart[name]) return;
  const doRemoval=()=>{
    const unitPrice=itemPrice[name] || 0;
    total-=unitPrice;
    cart[name]--;
    if(cart[name]<=0){
      delete cart[name];
      delete itemPrice[name];
    }
    if(total<0) total=0;
    updateCart();
  };
  const escaped = (typeof CSS!=="undefined" && CSS.escape) ? CSS.escape(name) : name.replace(/["\\]/g,"\\$&");
  const item = document.querySelector(`.cart-item[data-name="${escaped}"]`);
  if(item){
    item.classList.add("removing");
    item.addEventListener("animationend", doRemoval, {once:true});
  }else{
    doRemoval();
  }
}

async function checkout(){
  if(Object.keys(cart).length===0){
    alert(t("cartEmptyAlert"));
    return;
  }

  const code="DEVILSHOP-"+Date.now();
  const btn=document.getElementById("checkoutBtn");
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>'+t("checkoutLoading");

  try{

    await fetch(WEB_APP_URL,{
      method:"POST",
      body:JSON.stringify({
        code:code,
        items:JSON.stringify(cart),
        total:total
      })
    });

    document.getElementById("orderResult").innerHTML=`
      <div class="note-box" style="border-right-color:var(--gold);">
        <b>${t("trackingLabel")}</b><br>
        <input type="text" value="${code}" readonly style="width:70%;">
        <button onclick="copyText('${code}')">${t("copyBtn")}</button>
        <br><br>
        <small>${t("sendToLabel")}</small><br>
        <input type="text" value="@lm_DevlI" readonly style="width:70%;margin-top:5px;">
        <button onclick="copyText('@lm_DevlI')">${t("copyIdBtn")}</button>
      </div>`;

    cart={};
    itemPrice={};
    total=0;
    updateCart();
    launchConfetti();

  }catch(err){
    alert(t("orderErrorAlert"));
    console.log(err);
  }finally{
    btn.disabled=false;
    btn.textContent=t("checkoutBtn");
  }
}

function copyText(text){
  const textarea=document.createElement('textarea');
  textarea.value=text;
  textarea.style.position='fixed';
  textarea.style.top='-9999px';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert(t('copiedAlert'));
}

document.addEventListener("click", function(e){
  const btn = e.target.closest ? e.target.closest("button") : null;
  if(!btn || btn.disabled) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement("span");
  ripple.className = "ripple";
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
  ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
  btn.appendChild(ripple);
  ripple.addEventListener("animationend", () => ripple.remove(), {once:true});
});

function launchConfetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors=["#2aabee","#f2b640","#9b7bff","#ff6f91","#33d0ac"];
  for(let i=0;i<26;i++){
    const el=document.createElement("div");
    el.className="confetti-piece";
    const size=5+Math.random()*5;
    el.style.width=size+"px";
    el.style.height=size+"px";
    el.style.left=(Math.random()*100)+"vw";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay=(Math.random()*0.3)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1600);
  }
}

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  const btn=document.getElementById("themeToggle");
  if(btn){
    btn.innerHTML = theme==="light"
      ? `<svg class="neon-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>`
      : `<svg class="neon-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>`;
  }
  try{ localStorage.setItem("merajTheme", theme); }catch(e){}
}

function toggleTheme(){
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const btn=document.getElementById("themeToggle");
  if(btn){
    btn.classList.add("spin");
    setTimeout(()=>btn.classList.remove("spin"),400);
  }
  applyTheme(current==="dark" ? "light" : "dark");
}

(function initTheme(){
  let saved=null;
  try{ saved = localStorage.getItem("merajTheme"); }catch(e){}
  if(!saved){
    saved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  applyTheme(saved);
})();

function applyLanguage(lang){
  currentLang = lang;
  document.documentElement.setAttribute("lang", lang);
  try{ localStorage.setItem("merajLang", lang); }catch(e){}

  const brandTitle=document.getElementById("brandTitle");
  if(brandTitle) brandTitle.textContent = t("brandName");
  const tagline=document.getElementById("tagline");
  if(tagline) tagline.textContent = t("tagline");
  const cartHeading=document.getElementById("cartHeading");
  if(cartHeading) cartHeading.textContent = t("cartHeading");
  const langLabel=document.getElementById("langToggleLabel");
  if(langLabel) langLabel.textContent = (lang==="fa") ? "EN" : "فارسی";

  const themeBtn=document.getElementById("themeToggle");
  if(themeBtn) themeBtn.setAttribute("aria-label", t("themeAria"));
  const cartBtn=document.getElementById("cartToggleBtn");
  if(cartBtn) cartBtn.setAttribute("aria-label", t("cartAria"));
  const langBtn=document.getElementById("langToggle");
  if(langBtn) langBtn.setAttribute("aria-label", t("langAria"));
  const closeBtn=document.getElementById("cartCloseBtn");
  if(closeBtn) closeBtn.setAttribute("aria-label", t("closeAria"));
  const footerNote=document.getElementById("footerNote");
  if(footerNote) footerNote.textContent = t("footerNote");
  const footerCartLabel=document.getElementById("footerCartLabel");
  if(footerCartLabel) footerCartLabel.textContent = t("footerCartLabel");
  const rulesSummary=document.getElementById("rulesTitleText");
  if(rulesSummary) rulesSummary.textContent = t("rulesTitle");
  const rulesContent=document.getElementById("rulesContent");
  if(rulesContent) rulesContent.innerHTML = t("rulesText");

  const checkoutBtn=document.getElementById("checkoutBtn");
  if(checkoutBtn && !checkoutBtn.disabled) checkoutBtn.textContent = t("checkoutBtn");

  renderProducts();
  updateCart();
}

function toggleLang(){
  const icon=document.querySelector("#langToggle .lang-icon");
  if(icon){
    icon.classList.remove("flip");
    void icon.offsetWidth;
    icon.classList.add("flip");
  }
  document.body.classList.add("lang-fade");
  setTimeout(()=>{
    applyLanguage(currentLang==="fa" ? "en" : "fa");
    requestAnimationFrame(()=>{
      document.body.classList.remove("lang-fade");
    });
  }, 180);
}

(function initLang(){
  let saved=null;
  try{ saved = localStorage.getItem("merajLang"); }catch(e){}
  currentLang = saved || "fa";
})();

async function applyLivePrices(){
  try{
    const res=await fetch("data/prices.json",{cache:"no-store"});
    if(!res.ok) return; // فایل هنوز ساخته نشده یا در دسترس نیست؛ از قیمت‌های ثابت فعلی استفاده میشه
    const live=await res.json();

    const premiumCat=categories.find(c=>c.id==="premium");
    if(premiumCat && Array.isArray(live.premium)){
      live.premium.forEach(item=>{
        const p=premiumCat.products.find(p=>p.fa===item.name);
        if(p) p.price=item.priceToman;
      });
    }
  }catch(err){
    console.log("قیمت زنده در دسترس نیست، از قیمت‌های پیش‌فرض استفاده میشه:",err);
  }
}

applyLivePrices().finally(()=>{
  buildProductMeta();
  applyLanguage(currentLang);
});
