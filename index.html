<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاپ معراج</title>

<style>
:root{
  --bg:#0f0f0f;
  --card:#1c1c1c;
  --accent:#00ff88;
  --text:#ffffff;
}
body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:#000;
  box-shadow:0 0 15px var(--accent);
}
button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
  margin:3px;
}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}
.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 10px #00ff8844;
}
.icon{
  font-size:50px;
  margin-bottom:10px;
}
.category{
  padding:15px 20px 0 20px;
}
.category h2{
  border-right:4px solid var(--accent);
  padding-right:10px;
  font-size:20px;
}
.category-icon{
  font-size:26px;
  vertical-align:middle;
  margin-left:8px;
}
.empty-msg{
  color:#888;
  padding:15px;
  text-align:center;
}
.note-box{
  background:var(--card);
  border-right:4px solid var(--accent);
  border-radius:10px;
  padding:15px 18px;
  margin:10px 20px 20px 0;
  line-height:2;
  font-size:15px;
  text-align:right;
}
.note-box b{
  color:var(--accent);
}
.calc-box{
  background:var(--card);
  border-radius:12px;
  padding:15px 18px;
  margin:0 20px 20px 0;
  box-shadow:0 0 10px #00ff8844;
}
.calc-box label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
}
.calc-box input{
  width:90%;
  max-width:280px;
  display:block;
  margin-bottom:10px;
}
.calc-preview{
  min-height:20px;
  color:var(--accent);
  font-weight:bold;
  margin-bottom:8px;
}
.cart-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--card);
  padding:6px 12px;
  border-radius:8px;
  margin-bottom:6px;
  max-width:400px;
}
.remove-btn{
  background:#ff4444;
  color:#fff;
  padding:3px 10px;
  font-size:12px;
  margin:0;
}
input{
  padding:6px;
  border-radius:6px;
  border:none;
  margin:5px;
}
</style>
</head>

<body>

<header>🔥 شاپ معراج 🔥</header>

<div id="products"></div>

<div style="padding:20px;">
  <h3>🧺 سبد خرید</h3>
  <div id="cart"></div>
  <div id="total">جمع: 0 تومان</div>
  <button onclick="checkout()">ثبت خرید</button>
  <div id="orderResult" style="margin-top:15px;"></div>
</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbym8kE8fpshax03zN6Z05XZSfdllcpctPEfgqNWCr35iyHFFnHYv-zQ2N8iSCFNgtYo/exec";

const categories = [
  { id:"stars",   title:"استارز تلگرام",   icon:"⭐", products: [
      ["⭐","15 استارز",48000],
      ["⭐","25 استارز",80000],
      ["⭐","50 استارز",160000],
      ["⭐","100 استارز",320000],
      ["⭐","250 استارز",800000],
      ["⭐","300 استارز",960000]
  ] },
  { id:"premium", title:"تلگرام پرمیوم",   icon:"💎", products: [
      ["💎","پریمیوم 3 ماهه",2350000],
      ["💎","پریمیوم 6 ماهه",3250000],
      ["💎","پریمیوم 1 ساله",5500000]
  ] },
  { id:"nft",     title:"NFT تلگرام",      icon:"🖼️", products: [], note:
    `برای خرید NFT در تلگرام به آیدی <b>@lD_Meraj_SJ</b> پیام دهید و نام و در صورت لزوم عکس NFT مورد نظر را ارسال کنید.<br>
    قیمت نزد شما ارسال می‌گردد و در صورت پرداخت شما و ارسال فیش واریزی، NFT به اکانت شما هدیه می‌شود.<br>
    در صورتی که می‌خواهید NFT خریداری‌شده به اکانت دیگری هدیه شود، آیدی آن اکانت را ارسال کنید و اعلام بفرمایید که اکانت مورد نظر متعلق به شما نیست.`
  },
  { id:"gift",    title:"گیفت تلگرام",     icon:"🎁", products: [], note:
    `برای خرید گیفت در تلگرام به آیدی <b>@lD_Meraj_SJ</b> پیام دهید و نام و در صورت لزوم عکس گیفت مورد نظر را ارسال کنید.<br>
    قیمت نزد شما ارسال می‌گردد و در صورت پرداخت شما و ارسال فیش واریزی، گیفت به اکانت شما هدیه می‌شود.<br>
    در صورتی که می‌خواهید گیفت خریداری‌شده به اکانت دیگری هدیه شود، آیدی آن اکانت را ارسال کنید و اعلام بفرمایید که اکانت مورد نظر متعلق به شما نیست.`
  },
  { id:"meow",    title:"میو پوینت",       icon:"🐾", calculator:true, products: [], note:
    `📋 قیمت خرید میو پوینت:<br>
    🔹 از 1 تا 9 میلیون میو: میلی <b>10,000 تومان</b><br>
    🔹 از 9 تا 15 میلیون میو: میلی <b>9,000 تومان</b><br>
    🔹 از 15 تا 25 میلیون میو و بالاتر: میلی <b>8,000 تومان</b>`
  }
];

let cart = {};
let itemPrice = {};
let total = 0;

function renderProducts(){
  const container=document.getElementById("products");
  let html="";
  categories.forEach(cat=>{
    html+=`
    <div class="category" id="cat-${cat.id}">
      <h2><span class="category-icon">${cat.icon}</span>${cat.title}</h2>`;
    if(cat.note){
      html+=`<div class="note-box">${cat.note}</div>`;
    }else{
      html+=`<div class="container">`;
      if(cat.products.length===0){
        html+=`<div class="empty-msg">به‌زودی...</div>`;
      }else{
        cat.products.forEach(p=>{
          html+=`
          <div class="card">
            <div class="icon">${p[0]}</div>
            <h4>${p[1]}</h4>
            <p>${p[2]}<br>تومان</p>
            <button onclick="add('${p[1]}',${p[2]})">خرید</button>
          </div>`;
        });
      }
      html+=`</div>`;
    }
    if(cat.calculator){
      html+=`
      <div class="calc-box">
        <label for="meowQty">تعداد میو موردنظر را وارد کنید (بین 9,000,000 تا 500,000,000):</label>
        <input type="number" id="meowQty" min="9000000" max="500000000" step="1000000" placeholder="مثلاً 12000000">
        <div id="meowPricePreview" class="calc-preview"></div>
        <button onclick="addMeowToCart()">افزودن به سبد خرید</button>
      </div>`;
    }
    html+=`</div>`;
  });
  container.innerHTML=html;
  const meowInput=document.getElementById("meowQty");
  if(meowInput){
    meowInput.addEventListener("input",updateMeowPreview);
  }
}

function meowRate(qty){
  if(qty < 9000000) return null;
  if(qty < 15000000) return 9000;
  return 8000; // 15,000,000 and above (covers 15-25M and beyond, up to the 500M limit)
}

function meowPrice(qty){
  const rate=meowRate(qty);
  if(rate===null) return null;
  return Math.round((qty/1000000)*rate);
}

function updateMeowPreview(){
  const input=document.getElementById("meowQty");
  const preview=document.getElementById("meowPricePreview");
  if(!input||!preview) return;
  const qty=parseInt(input.value);
  if(!qty){ preview.innerText=""; return; }
  if(qty<9000000 || qty>500000000){
    preview.innerText="تعداد باید بین 9,000,000 تا 500,000,000 باشد";
    return;
  }
  const price=meowPrice(qty);
  preview.innerText="قیمت: "+price.toLocaleString('fa-IR')+" تومان";
}

function addMeowToCart(){
  const input=document.getElementById("meowQty");
  const qty=parseInt(input.value);
  if(!qty || qty<9000000 || qty>500000000){
    alert("لطفاً تعدادی بین 9,000,000 تا 500,000,000 وارد کنید");
    return;
  }
  const price=meowPrice(qty);
  const name=qty.toLocaleString('fa-IR')+" میو پوینت";
  add(name,price);
  input.value="";
  document.getElementById("meowPricePreview").innerText="";
}

function add(name,price){
  if(!cart[name]) cart[name]=0;
  cart[name]++;
  itemPrice[name]=price;
  total+=price;
  updateCart();
}

function updateCart(){
  let html="";
  for(let i in cart){
    html+=`<div class="cart-item">${cart[i]} × ${i} <button class="remove-btn" onclick="removeFromCart('${i}')">حذف</button></div>`;
  }
  document.getElementById("cart").innerHTML=html;
  document.getElementById("total").innerText="جمع: "+total+" تومان";
}

function removeFromCart(name){
  if(!cart[name]) return;
  const unitPrice=itemPrice[name] || 0;
  total-=unitPrice;
  cart[name]--;
  if(cart[name]<=0){
    delete cart[name];
    delete itemPrice[name];
  }
  if(total<0) total=0;
  updateCart();
}

async function checkout(){
  if(Object.keys(cart).length===0){
    alert("سبد خالی است");
    return;
  }

  const code="MERAJSHOP-"+Date.now();

  try{

    await fetch(WEB_APP_URL,{
      method:"POST",
      body:JSON.stringify({
        code:code,
        items:JSON.stringify(cart),
        total:total
      })
    });

    document.getElementById("orderResult").innerHTML=`
      <div style="background:#1a1a1a;padding:10px;border-radius:8px;">
        <b>کد رهگیری شما:</b><br>
        <input type="text" value="${code}" readonly style="width:70%;">
        <button onclick="copyText('${code}')">کپی</button>
        <br><br>
        <small>: در تلگرام ارسال کنید به</small><br>
        <input type="text" value="@lD_Meraj_SJ" readonly style="width:70%;margin-top:5px;">
        <button onclick="copyText('@lD_Meraj_SJ')">کپی آیدی</button>
      </div>`;

    cart={};
    itemPrice={};
    total=0;
    updateCart();

  }catch(err){
    alert("خطا در ارسال سفارش ❌");
    console.log(err);
  }
}

function copyText(text){
  const textarea=document.createElement('textarea');
  textarea.value=text;
  textarea.style.position='fixed';
  textarea.style.top='-9999px';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('کپی شد ✅');
}

renderProducts();

</script>

</body>
</html>
